<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKI COUNTDOWN ⛷️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Montserrat, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 20%, #147ea8 0%, transparent 35%),
        linear-gradient(135deg, #020912, #071d2d, #003e5c);
    position: relative;
    transition: .7s;
}

/* =========================
   MODE LUMIÈRE
========================= */

body.light {
    color: #08253a;
    background:
        radial-gradient(circle at 50% 20%, #b7f0ff, transparent 40%),
        linear-gradient(135deg, #dff8ff, #ffffff, #9edcf5);
}

body.light .card {
    background: rgba(255,255,255,.58);
    border-color: rgba(0,130,190,.2);
    color: #08253a;
}

body.light .unit {
    background: rgba(255,255,255,.65);
    border-color: rgba(0,130,190,.18);
}

body.light .progress {
    background: rgba(0,80,120,.12);
}

body.light .bar {
    background: linear-gradient(90deg,#00aeea,#006cff);
}

/* =========================
   NEIGE
========================= */

.snow {
    position: absolute;
    inset: -100px;
    pointer-events: none;

    background-image:
        radial-gradient(circle, white 2px, transparent 3px),
        radial-gradient(circle, rgba(255,255,255,.7) 1px, transparent 2px),
        radial-gradient(circle, rgba(255,255,255,.5) 2px, transparent 3px);

    background-size:
        70px 70px,
        43px 43px,
        110px 110px;

    animation: snow 10s linear infinite;
    opacity: .65;
}

@keyframes snow {
    to {
        background-position:
            30px 600px,
            -40px 500px,
            50px 700px;
    }
}

/* =========================
   MONTAGNES
========================= */

.mountain {
    position: absolute;
    bottom: -5vh;
    left: -10%;
    width: 120%;
    height: 42vh;

    background: #eefaff;

    clip-path: polygon(
        0 100%,
        0 65%,
        12% 40%,
        22% 65%,
        33% 20%,
        45% 68%,
        58% 33%,
        70% 70%,
        82% 27%,
        92% 62%,
        100% 40%,
        100% 100%
    );

    opacity: .8;
}

.mountain.back {
    height: 35vh;
    opacity: .3;
    transform: scaleX(1.15);
}

/* =========================
   BOUTON MODE
========================= */

.theme {
    position: absolute;
    right: 20px;
    top: 20px;
    z-index: 30;
}

.theme button {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(0,20,35,.5);
    color: white;
    border-radius: 50px;
    padding: 11px 17px;
    cursor: pointer;
    font-weight: 800;
    font-size: .7rem;
    letter-spacing: 1px;
    backdrop-filter: blur(12px);
}

/* =========================
   INTRO
========================= */

.start {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle, rgba(0,200,255,.2), transparent 40%),
        #020a12;

    animation: introFade .35s ease;
}

.start.hide {
    animation: hideIntro .65s ease forwards;
}

@keyframes introFade {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes hideIntro {
    from {
        opacity: 1;
        transform: scale(1);
    }

    to {
        opacity: 0;
        transform: scale(1.08);
        visibility: hidden;
    }
}

/* GOUTTE */

.drop-area {
    width: 200px;
    height: 270px;
    position: relative;
}

.drop {
    position: absolute;
    left: 50%;
    top: -80px;

    width: 48px;
    height: 65px;

    transform: translateX(-50%);

    animation:
        dropFall 1.35s cubic-bezier(.2,.8,.25,1) forwards;

    filter:
        drop-shadow(0 0 10px #70eaff)
        drop-shadow(0 0 35px #00aaff);
}

.drop::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            135deg,
            white,
            #72e9ff 40%,
            #009fe3
        );

    border-radius:
        50% 50% 55% 55% /
        35% 35% 70% 70%;

    transform: rotate(45deg);
}

.drop::after {
    content: "";

    position: absolute;
    width: 9px;
    height: 23px;

    left: 12px;
    top: 12px;

    border-radius: 50%;

    background: rgba(255,255,255,.8);

    transform: rotate(25deg);
}

@keyframes dropFall {

    0% {
        transform:
            translate(-50%, -50px)
            scale(.6);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    75% {
        transform:
            translate(-50%, 175px)
            scale(1);
        opacity: 1;
    }

    85% {
        transform:
            translate(-50%, 175px)
            scale(1.2,.75);
    }

    100% {
        transform:
            translate(-50%, 175px)
            scale(1.4,.4);
        opacity: 0;
    }
}

/* ONDE */

.ripple {
    position: absolute;

    left: 50%;
    top: 235px;

    width: 90px;
    height: 25px;

    transform: translateX(-50%) scale(.1);

    border:
        2px solid #62eaff;

    border-radius: 50%;

    box-shadow:
        0 0 15px #00cfff,
        0 0 35px rgba(0,200,255,.6);

    opacity: 0;

    animation:
        ripple 1.35s ease-out forwards;
}

.ripple.two {
    animation-delay: .12s;
}

@keyframes ripple {

    65% {
        opacity: 0;
        transform: translateX(-50%) scale(.2);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateX(-50%) scale(3.8);
    }
}

.start-text {
    font-size: .7rem;
    letter-spacing: 5px;
    opacity: .6;

    text-shadow:
        0 0 10px #55ddff,
        0 0 25px #00bfff;
}

/* =========================
   CARTE
========================= */

.card {
    z-index: 10;

    width: min(1180px,94vw);

    padding: 38px;

    border-radius: 34px;

    background: rgba(3,20,34,.6);

    border:
        1px solid rgba(255,255,255,.25);

    backdrop-filter: blur(20px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.12);

    text-align: center;

    animation:
        cardIn 1s .1s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform:
            translateY(50px)
            scale(.9);
        filter: blur(15px);
    }

    70% {
        transform:
            translateY(-5px)
            scale(1.02);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
        filter: blur(0);
    }
}

/* =========================
   TITRE
========================= */

.badge {
    display: inline-block;

    padding: 9px 16px;

    border-radius: 50px;

    background: rgba(255,255,255,.1);

    border:
        1px solid rgba(255,255,255,.2);

    font-size: .7rem;
    font-weight: 800;

    letter-spacing: 2px;
}

h1 {
    margin: 17px 0 5px;

    font-size:
        clamp(3rem,8vw,7rem);

    line-height: .85;

    font-weight: 900;

    letter-spacing: -5px;

    text-shadow:
        0 0 10px rgba(100,230,255,.5),
        0 0 35px rgba(0,180,255,.35);

    animation: neon 2.5s infinite ease-in-out;
}

@keyframes neon {

    0%,100% {
        text-shadow:
            0 0 8px rgba(100,230,255,.4),
            0 0 30px rgba(0,180,255,.25);
    }

    50% {
        text-shadow:
            0 0 15px #70eaff,
            0 0 40px #00bfff,
            0 0 70px rgba(0,190,255,.4);
    }
}

.subtitle {
    margin: 16px 0 32px;
    opacity: .7;
}

/* =========================
   COMPTEUR
========================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(6,1fr);

    gap: 12px;
}

.unit {
    padding: 21px 8px 16px;

    border-radius: 20px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.05)
        );

    border:
        1px solid rgba(255,255,255,.16);

    transition:
        transform .25s,
        box-shadow .25s;
}

.unit:hover {
    transform:
        translateY(-7px)
        scale(1.03);

    box-shadow:
        0 15px 40px rgba(0,0,0,.25),
        0 0 25px rgba(0,200,255,.18);
}

.number {
    display: block;

    font-family:
        "Space Mono",
        monospace;

    font-size:
        clamp(1.5rem,4vw,3.6rem);

    font-weight: 700;

    line-height: 1;
}

.label {
    display: block;

    margin-top: 10px;

    font-size: .62rem;

    letter-spacing: 1.7px;

    opacity: .55;

    text-transform: uppercase;
}

/* Animation seconde */

.tick {
    animation: tick .25s ease;
}

@keyframes tick {

    50% {
        transform: translateY(-5px) scale(1.05);

        box-shadow:
            0 0 25px rgba(80,220,255,.4);
    }
}

/* =========================
   MILLISECONDES
========================= */

.ms {
    margin-top: 18px;

    font-family:
        "Space Mono",
        monospace;
}

.ms strong {
    font-size: 2.3rem;

    text-shadow:
        0 0 15px #55ddff;
}

/* =========================
   PROGRESS BAR
========================= */

.progress-container {
    max-width: 900px;

    margin:
        28px auto 0;
}

.progress-info {
    display: flex;

    justify-content: space-between;

    font-size: .6rem;

    font-weight: 800;

    letter-spacing: 1.5px;

    opacity: .55;

    margin-bottom: 8px;
}

.progress {
    height: 9px;

    border-radius: 99px;

    background:
        rgba(255,255,255,.1);

    overflow: visible;

    position: relative;
}

.bar {
    height: 100%;

    width: 0%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #62eaff,
            white,
            #00bfff
        );

    box-shadow:
        0 0 12px #55ddff,
        0 0 35px rgba(0,200,255,.6);

    transition:
        width .1s linear;
}

.bar::after {
    content: "";

    position: absolute;

    right: -5px;

    top: 50%;

    width: 17px;
    height: 17px;

    transform: translateY(-50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 22px #55ddff,
        0 0 40px #00bfff;
}

/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 17px;

    font-size: .68rem;

    opacity: .45;

    letter-spacing: 1px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px) {

    .grid {
        grid-template-columns:
            repeat(3,1fr);
    }

    .card {
        padding: 27px 16px;
    }

    h1 {
        letter-spacing: -3px;
    }
}

@media(max-width:430px) {

    .theme {
        right: 10px;
        top: 10px;
    }

    .theme button {
        padding: 8px 11px;
        font-size: .58rem;
    }

    .grid {
        gap: 7px;
    }

    .unit {
        padding: 15px 4px;
    }

    .number {
        font-size: 1.4rem;
    }

    .label {
        font-size: .52rem;
    }
}
</style>
</head>

<body>

<div class="snow"></div>

<div class="mountain back"></div>
<div class="mountain"></div>

<!-- MODE -->
<div class="theme">
    <button id="themeBtn">
        ☀️ MODE LUMIÈRE
    </button>
</div>

<!-- INTRO -->
<div class="start" id="start">

    <div class="drop-area">

        <div class="drop"></div>

        <div class="ripple"></div>
        <div class="ripple two"></div>

    </div>

    <div class="start-text">
        SKI COUNTDOWN
    </div>

</div>

<!-- COMPTEUR -->
<section class="card">

    <div class="badge">
        ❄️ SAISON SKI 2027
    </div>

    <h1>
        SKI TIME
    </h1>

    <div class="subtitle">
        Direction les pistes — 
        <strong>6 février 2027</strong>
    </div>

    <div class="grid">

        <div class="unit">
            <span class="number" id="months">0</span>
            <span class="label">Mois</span>
        </div>

        <div class="unit">
            <span class="number" id="weeks">0</span>
            <span class="label">Semaines</span>
        </div>

        <div class="unit">
            <span class="number" id="days">0</span>
            <span class="label">Jours</span>
        </div>

        <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="label">Heures</span>
        </div>

        <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutes</span>
        </div>

        <div class="unit" id="secondsBox">
            <span class="number" id="seconds">00</span>
            <span class="label">Secondes</span>
        </div>

    </div>

    <div class="ms">
        <strong id="milliseconds">
            000
        </strong>
        ms
    </div>

    <!-- PROGRESSION -->
    <div class="progress-container">

        <div class="progress-info">

            <span id="startDate">
                --/--/----
            </span>

            <span id="progressText">
                0%
            </span>

            <span>
                06/02/2027
            </span>

        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

    </div>

    <div class="footer">
        ⛷️ Le compte à rebours commence aujourd'hui
    </div>

</section>

<script>

/* =========================
   DATE CIBLE
========================= */

const target =
    new Date(2027, 1, 6, 0, 0, 0, 0);

const startDate =
    new Date();

/* =========================
   COMPTEUR
========================= */

function updateCountdown() {

    const now = new Date();

    let diff =
        target - now;

    if (diff <= 0) {

        document.querySelector(".card").innerHTML = `
            <div class="badge">
                🎿 6 FÉVRIER 2027
            </div>

            <h1>
                C'EST PARTI !
            </h1>

            <div class="subtitle">
                Direction les pistes ❄️⛷️
            </div>
        `;

        return;
    }

    /* DATE DU JOUR */

    const dd =
        String(now.getDate()).padStart(2,"0");

    const mm =
        String(now.getMonth()+1).padStart(2,"0");

    const yyyy =
        now.getFullYear();

    document.getElementById("startDate")
        .textContent =
        `${dd}/${mm}/${yyyy}`;

    /* MOIS */

    let months =
        (target.getFullYear() -
         now.getFullYear()) * 12
        +
        target.getMonth() -
        now.getMonth();

    const test =
        new Date(now);

    test.setMonth(
        test.getMonth() + months
    );

    if (test > target) {
        months--;
    }

    const anchor =
        new Date(now);

    anchor.setMonth(
        anchor.getMonth() + months
    );

    let rest =
        target - anchor;

    const WEEK =
        604800000;

    const DAY =
        86400000;

    const HOUR =
        3600000;

    const MINUTE =
        60000;

    const SECOND =
        1000;

    const weeks =
        Math.floor(rest / WEEK);

    rest %= WEEK;

    const days =
        Math.floor(rest / DAY);

    rest %= DAY;

    const hours =
        Math.floor(rest / HOUR);

    rest %= HOUR;

    const minutes =
        Math.floor(rest / MINUTE);

    rest %= MINUTE;

    const seconds =
        Math.floor(rest / SECOND);

    const milliseconds =
        rest % 1000;

    /* AFFICHAGE */

    document.getElementById("months")
        .textContent = months;

    document.getElementById("weeks")
        .textContent =
        String(weeks).padStart(2,"0");

    document.getElementById("days")
        .textContent =
        String(days).padStart(2,"0");

    document.getElementById("hours")
        .textContent =
        String(hours).padStart(2,"0");

    document.getElementById("minutes")
        .textContent =
        String(minutes).padStart(2,"0");

    document.getElementById("seconds")
        .textContent =
        String(seconds).padStart(2,"0");

    document.getElementById("milliseconds")
        .textContent =
        String(milliseconds).padStart(3,"0");

    /* ANIMATION SECONDE */

    if (milliseconds < 30) {

        const box =
            document.getElementById(
                "secondsBox"
            );

        box.classList.remove("tick");

        void box.offsetWidth;

        box.classList.add("tick");
    }

    /* PROGRESS BAR */

    const total =
        target - startDate;

    const elapsed =
        now - startDate;

    const percent =
        Math.min(
            100,
            Math.max(
                0,
                (elapsed / total) * 100
            )
        );

    document.getElementById("bar")
        .style.width =
        percent + "%";

    document.getElementById("progressText")
        .textContent =
        percent.toFixed(4) + "%";
}

/* =========================
   INTRO AUTOMATIQUE
========================= */

setTimeout(() => {

    document
        .getElementById("start")
        .classList.add("hide");

}, 1500);

/* =========================
   MODE LUMIÈRE / NÉON
========================= */

document
    .getElementById("themeBtn")
    .addEventListener("click", () => {

        document.body
            .classList.toggle("light");

        const light =
            document.body
                .classList
                .contains("light");

        document.getElementById("themeBtn")
            .textContent =
            light
            ? "🌙 MODE NÉON"
            : "☀️ MODE LUMIÈRE";
    });

/* =========================
   RAF POUR LES MILLISECONDES
========================= */

function loop() {

    updateCountdown();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
