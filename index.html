<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Compte à rebours Ski</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    font-family: "Montserrat", sans-serif;
    background:
        radial-gradient(circle at 50% 20%, rgba(0, 200, 255, .16), transparent 30%),
        linear-gradient(135deg, #020817, #06182b 55%, #02050d);
    color: white;
    transition: .5s;
}

/* =========================
   MODE CLAIR
========================= */

body.light {
    background:
        radial-gradient(circle at 50% 20%, rgba(0, 170, 255, .18), transparent 35%),
        linear-gradient(135deg, #dff7ff, #ffffff 60%, #dcefff);

    color: #07111f;
}

/* =========================
   NEIGE
========================= */

.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

.snow span {
    position: absolute;
    top: -20px;
    color: white;
    font-size: 10px;
    animation: fall linear infinite;
    opacity: .8;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

/* =========================
   BOUTON THEME
========================= */

.theme {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 20;

    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.1);
    backdrop-filter: blur(15px);

    color: inherit;
    border-radius: 50px;
    padding: 11px 16px;

    cursor: pointer;
    font-weight: 700;

    transition: .3s;
}

.theme:hover {
    transform: scale(1.08);
}

/* =========================
   INTRO
========================= */

.intro {
    position: fixed;
    inset: 0;
    z-index: 100;

    background: #020817;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity .7s, visibility .7s;
}

.intro.hide {
    opacity: 0;
    visibility: hidden;
}

.drop {
    position: absolute;

    width: 28px;
    height: 40px;

    background: linear-gradient(180deg, #8eeaff, #00aaff);

    border-radius: 60% 60% 70% 70%;
    transform: rotate(45deg);

    top: -60px;

    box-shadow:
        0 0 20px #00c8ff,
        0 0 60px rgba(0,200,255,.8);

    animation: dropFall 1s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes dropFall {
    0% {
        top: -60px;
        transform: rotate(45deg) scale(.7);
    }

    75% {
        top: 48%;
        transform: rotate(45deg) scale(1);
    }

    100% {
        top: 50%;
        transform: rotate(45deg) scale(.2);
        opacity: 0;
    }
}

.ripple {
    position: absolute;

    width: 20px;
    height: 20px;

    border: 3px solid #00c8ff;
    border-radius: 50%;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    opacity: 0;

    animation: ripple 1.2s .75s ease-out forwards;
}

@keyframes ripple {
    0% {
        width: 20px;
        height: 20px;
        opacity: 1;
    }

    100% {
        width: 350px;
        height: 140px;
        opacity: 0;
    }
}

.intro-title {
    position: absolute;

    bottom: 25%;

    font-size: clamp(20px, 5vw, 50px);
    font-weight: 900;
    letter-spacing: 5px;

    opacity: 0;

    animation: introText 1s .6s forwards;
}

@keyframes introText {
    to {
        opacity: 1;
        transform: translateY(-10px);
    }
}

/* =========================
   CONTENU
========================= */

.container {
    position: relative;
    z-index: 5;

    width: min(1100px, 92%);
    margin: auto;

    padding: 80px 0 60px;

    text-align: center;
}

/* =========================
   TITRE
========================= */

h1 {
    font-size: clamp(38px, 8vw, 85px);
    font-weight: 900;

    letter-spacing: -3px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #7de8ff,
        #ffffff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    text-shadow: 0 0 30px rgba(0,200,255,.2);
}

.light h1 {
    background: linear-gradient(
        90deg,
        #061426,
        #008fd1,
        #061426
    );

    -webkit-background-clip: text;
}

.subtitle {
    margin-top: 10px;

    opacity: .7;

    font-size: 15px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* =========================
   DATE
========================= */

.target-date {
    margin-top: 25px;

    font-size: clamp(20px, 4vw, 32px);
    font-weight: 800;

    color: #6eeaff;

    text-shadow:
        0 0 10px rgba(0,220,255,.6),
        0 0 30px rgba(0,220,255,.25);
}

.light .target-date {
    color: #0087c1;
}

/* =========================
   COUNTDOWN
========================= */

.countdown {
    margin-top: 45px;

    display: grid;
    grid-template-columns: repeat(6, 1fr);

    gap: 12px;
}

.card {
    position: relative;

    padding: 22px 10px;

    border-radius: 20px;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.15);

    backdrop-filter: blur(15px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.25),
        inset 0 0 20px rgba(255,255,255,.02);

    transition: .3s;
}

.card:hover {
    transform: translateY(-7px);

    box-shadow:
        0 15px 45px rgba(0,200,255,.2);
}

.number {
    font-family: "Space Mono", monospace;

    font-size: clamp(25px, 4vw, 45px);
    font-weight: 700;

    color: #ffffff;

    text-shadow:
        0 0 10px rgba(0,220,255,.7),
        0 0 25px rgba(0,220,255,.3);
}

.light .card {
    background: rgba(255,255,255,.65);
    border-color: rgba(0,80,120,.15);
}

.light .number {
    color: #07111f;
}

.label {
    margin-top: 7px;

    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;

    opacity: .6;
}

/* =========================
   MILLISECONDES
========================= */

.milliseconds {
    margin-top: 15px;

    font-family: "Space Mono", monospace;

    font-size: clamp(18px, 3vw, 30px);

    color: #70eaff;

    text-shadow: 0 0 15px rgba(0,220,255,.8);
}

/* =========================
   BARRE DE PROGRESSION
========================= */

.progress-section {
    margin-top: 55px;

    padding: 25px;

    border-radius: 24px;

    background: rgba(255,255,255,.06);

    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(15px);
}

.progress-top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 14px;

    font-size: 13px;
}

.progress-title {
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#progressText {
    font-family: "Space Mono", monospace;
    color: #70eaff;
}

/* BARRE */

.progress {
    width: 100%;
    height: 18px;

    border-radius: 50px;

    background: rgba(255,255,255,.1);

    overflow: hidden;

    box-shadow:
        inset 0 0 10px rgba(0,0,0,.3);
}

.bar {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            #00aaff,
            #70f0ff,
            #ffffff
        );

    box-shadow:
        0 0 10px #00c8ff,
        0 0 30px rgba(0,200,255,.7);

    transition: width .15s linear;
}

/* =========================
   DATES BARRE
========================= */

.progress-dates {
    display: flex;
    justify-content: space-between;

    margin-top: 10px;

    font-size: 11px;

    opacity: .6;
}

/* =========================
   MONTAGNES
========================= */

.mountains {
    position: fixed;

    bottom: 0;
    left: 0;

    width: 100%;
    height: 180px;

    z-index: 2;

    pointer-events: none;
}

.mountain {
    position: absolute;
    bottom: 0;

    width: 0;
    height: 0;

    border-left: 180px solid transparent;
    border-right: 180px solid transparent;
    border-bottom: 230px solid rgba(5,35,60,.8);
}

.mountain:nth-child(1) {
    left: -100px;
}

.mountain:nth-child(2) {
    left: 20%;
    transform: scale(1.3);
}

.mountain:nth-child(3) {
    right: 10%;
    transform: scale(1.1);
}

.mountain:nth-child(4) {
    right: -150px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .countdown {
        grid-template-columns: repeat(3, 1fr);
    }

    .container {
        padding-top: 70px;
    }
}

@media (max-width: 500px) {

    .countdown {
        grid-template-columns: repeat(2, 1fr);
    }

    .progress-section {
        padding: 18px;
    }

    h1 {
        letter-spacing: -2px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INTRO
========================= -->

<div class="intro" id="intro">

    <div class="drop"></div>
    <div class="ripple"></div>

    <div class="intro-title">
        ❄️ PRÊT POUR LE SKI ?
    </div>

</div>

<!-- =========================
     NEIGE
========================= -->

<div class="snow" id="snow"></div>

<!-- =========================
     THEME
========================= -->

<button class="theme" id="themeBtn">
    ☀️ / 🌙
</button>

<!-- =========================
     CONTENU
========================= -->

<main class="container">

    <div class="subtitle">
        Le départ approche
    </div>

    <h1>
        SKI TIME
    </h1>

    <div class="target-date">
        06 FÉVRIER 2027
    </div>

    <section class="countdown">

        <div class="card">
            <div class="number" id="months">0</div>
            <div class="label">Mois</div>
        </div>

        <div class="card">
            <div class="number" id="weeks">0</div>
            <div class="label">Semaines</div>
        </div>

        <div class="card">
            <div class="number" id="days">0</div>
            <div class="label">Jours</div>
        </div>

        <div class="card">
            <div class="number" id="hours">0</div>
            <div class="label">Heures</div>
        </div>

        <div class="card">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="card">
            <div class="number" id="seconds">0</div>
            <div class="label">Secondes</div>
        </div>

    </section>

    <div class="milliseconds" id="milliseconds">
        .000
    </div>

    <!-- =========================
         PROGRESSION
    ========================= -->

    <section class="progress-section">

        <div class="progress-top">

            <div class="progress-title">
                Progression vers le ski
            </div>

            <div id="progressText">
                0.0000%
            </div>

        </div>

        <div class="progress">
            <div class="bar" id="bar"></div>
        </div>

        <div class="progress-dates">

            <span id="startDate">
                Aujourd'hui
            </span>

            <span>
                06/02/2027
            </span>

        </div>

    </section>

</main>

<!-- =========================
     MONTAGNES
========================= -->

<div class="mountains">

    <div class="mountain"></div>
    <div class="mountain"></div>
    <div class="mountain"></div>
    <div class="mountain"></div>

</div>

<script>

/* =========================
   NEIGE
========================= */

const snow = document.getElementById("snow");

for (let i = 0; i < 80; i++) {

    const flake = document.createElement("span");

    flake.textContent = "❄";

    flake.style.left = Math.random() * 100 + "%";

    flake.style.fontSize =
        (5 + Math.random() * 10) + "px";

    flake.style.animationDuration =
        (5 + Math.random() * 8) + "s";

    flake.style.animationDelay =
        (-Math.random() * 10) + "s";

    snow.appendChild(flake);
}


/* =========================
   DATE CIBLE
========================= */

const target = new Date(
    2027,
    1,
    6,
    0,
    0,
    0,
    0
);


/* =========================
   ELEMENTS
========================= */

const monthsEl = document.getElementById("months");
const weeksEl = document.getElementById("weeks");
const daysEl = document.getElementById("days");
const hoursEl = document.getElementById("hours");
const minutesEl = document.getElementById("minutes");
const secondsEl = document.getElementById("seconds");
const millisecondsEl = document.getElementById("milliseconds");

const bar = document.getElementById("bar");
const progressText = document.getElementById("progressText");
const startDateEl = document.getElementById("startDate");


/* =========================
   ZERO
========================= */

function pad(number, length = 2) {

    return String(number).padStart(length, "0");

}


/* =========================
   COMPTE À REBOURS
========================= */

function updateCountdown(now) {

    let remaining = target - now;

    if (remaining <= 0) {

        monthsEl.textContent = "0";
        weeksEl.textContent = "0";
        daysEl.textContent = "0";
        hoursEl.textContent = "0";
        minutesEl.textContent = "0";
        secondsEl.textContent = "0";
        millisecondsEl.textContent = ".000";

        return;
    }


    /*
       Calcul des mois calendaires
    */

    let anchor = new Date(now);

    let months = 0;

    while (true) {

        const next = new Date(anchor);

        next.setMonth(next.getMonth() + 1);

        if (next <= target) {

            anchor = next;
            months++;

        } else {

            break;

        }

    }


    /*
       Temps restant après les mois
    */

    let diff = target - anchor;


    const weeks = Math.floor(
        diff / (1000 * 60 * 60 * 24 * 7)
    );

    diff -=
        weeks *
        7 *
        24 *
        60 *
        60 *
        1000;


    const days = Math.floor(
        diff / (1000 * 60 * 60 * 24)
    );

    diff -=
        days *
        24 *
        60 *
        60 *
        1000;


    const hours = Math.floor(
        diff / (1000 * 60 * 60)
    );

    diff -=
        hours *
        60 *
        60 *
        1000;


    const minutes = Math.floor(
        diff / (1000 * 60)
    );

    diff -=
        minutes *
        60 *
        1000;


    const seconds = Math.floor(
        diff / 1000
    );

    const milliseconds =
        diff % 1000;


    /*
       Affichage
    */

    monthsEl.textContent = months;

    weeksEl.textContent = weeks;

    daysEl.textContent = days;

    hoursEl.textContent = pad(hours);

    minutesEl.textContent = pad(minutes);

    secondsEl.textContent = pad(seconds);

    millisecondsEl.textContent =
        "." + pad(milliseconds, 3);

}


/* =========================
   BARRE DE PROGRESSION
   CORRIGÉE
========================= */

function updateProgress(now) {

    /*
       DÉBUT :
       aujourd'hui à 00:00:00.000
    */

    const startOfToday = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        0,
        0,
        0,
        0
    );


    /*
       FIN :
       6 février 2027 à 00:00:00.000
    */

    const endDate = new Date(
        2027,
        1,
        6,
        0,
        0,
        0,
        0
    );


    /*
       Durée totale
    */

    const totalTime =
        endDate - startOfToday;


    /*
       Temps déjà écoulé
    */

    const elapsedTime =
        now - startOfToday;


    /*
       Pourcentage
    */

    let percent =
        (elapsedTime / totalTime) * 100;


    /*
       Sécurité :
       toujours entre 0 et 100
    */

    percent = Math.max(
        0,
        Math.min(100, percent)
    );


    /*
       Si la date cible est dépassée
    */

    if (now >= endDate) {
        percent = 100;
    }


    /*
       Barre
    */

    bar.style.width =
        percent + "%";


    /*
       Texte
    */

    progressText.textContent =
        percent.toFixed(4) + "%";


    /*
       Date de départ
    */

    startDateEl.textContent =
        pad(now.getDate()) +
        "/" +
        pad(now.getMonth() + 1) +
        "/" +
        now.getFullYear();

}


/* =========================
   ANIMATION PRINCIPALE
========================= */

function animate() {

    const now = new Date();

    updateCountdown(now);

    updateProgress(now);

    requestAnimationFrame(animate);

}

animate();


/* =========================
   INTRO AUTOMATIQUE
========================= */

setTimeout(() => {

    document
        .getElementById("intro")
        .classList.add("hide");

}, 1800);


/* =========================
   MODE CLAIR / SOMBRE
========================= */

const themeBtn =
    document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {

    document.body.classList.toggle("light");

});


</script>

</body>
</html>
